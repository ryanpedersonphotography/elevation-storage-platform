# Facility Standalone — Custom Domain Deploy
# Each standalone facility gets its OWN Netlify site, all from the same repo.
#
# Netlify Dashboard Setup (repeat per facility):
#   1. Create new site → Import from Git → select this repo
#   2. Set "Base directory" to: Client_Jerry/jerry-template/apps/facility-standalone
#   3. Add environment variable: FACILITY_SLUG = <facility-slug>  (e.g. "riverside")
#   4. Configure custom domain in Domain settings (e.g. riversidestorage.com)
#   5. Netlify auto-reads this file for build command + publish dir
#
# IMPORTANT: Each facility = separate Netlify site with different FACILITY_SLUG.
# Do NOT reuse a single site for multiple facilities.

[build]
  command = "cd ../.. && bun install && turbo build --filter=@jerry/facility-standalone"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.2.5"
  # FACILITY_SLUG is set per-site in the Netlify dashboard, NOT here.
  # Setting it here would hardcode one facility for all deploys.

# SPA-style fallback for static export — serves 404.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
